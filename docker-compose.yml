services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hotelapi-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: hotelapi
      DATABASE_USER: hotelapi
      DATABASE_PASSWORD: hotelapi_password
      DATABASE_URL: postgres://hotelapi:hotelapi_password@postgres:5432/hotelapi
    ports:
      - "3000:3000"
    restart: unless-stopped

  postgres:
    image: postgres:18
    container_name: hotelapi-postgres
    environment:
      POSTGRES_DB: hotelapi
      POSTGRES_USER: hotelapi
      POSTGRES_PASSWORD: hotelapi_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotelapi -d hotelapi"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: hotelapi-pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin_password
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    restart: unless-stopped

volumes:
  postgres_data:
  pgadmin_data:
